<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — BiPSU SRMS</title>
  <meta name="description" content="Sign in to the BiPSU Scholarship Records Management System to apply for a scholarship, submit a renewal, or check the status of an application." />
  <link rel="canonical" href="http://testserver/login/" />
  
<link rel="icon" href="static/img/favicon.ico?v=2" sizes="any" />
<link rel="icon" type="image/png" href="static/img/favicon-32.png?v=2" sizes="32x32" />
<link rel="apple-touch-icon" href="static/img/apple-touch-icon.png?v=2" />

  <meta name="theme-color" content="#1a2168" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080b20" media="(prefers-color-scheme: dark)" />
  
  <link rel="stylesheet" href="static/css/tailwind.css?v=2" />
  <link rel="stylesheet" href="static/css/srms.css?v=149" />
  <script src="static/js/theme.js"></script>
  <script src="static/js/display-prefs.js?v=1"></script>

<link rel="stylesheet" href="static/demo/demo.css">
</head>
<body data-portal="student" class="auth-page">
  <div class="auth-shell">
    <div class="auth-brand">
      <img src="media/logos/BiPSU.png?v=2" alt="BiPSU" class="h-16 w-16 object-contain mx-auto mb-3" />
      <h1 class="text-2xl font-bold">BiPSU SRMS</h1>
      <p class="text-sm mt-1">Scholarship Records Management System</p>
    </div>
    <div class="auth-card">
      <h2 class="text-lg font-bold mb-1">Sign in</h2>
      <p class="auth-sub mb-5">Use the email and password you registered with.</p>
      
      
      

      
      <form method="post">
        
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label for="f-email">Email</label>
            <input id="f-email" type="email" name="email" value="" placeholder="you@gmail.com" required autocomplete="email" autofocus />
          </div>
          <div class="space-y-1.5">
            <label for="f-password">Password</label>
            <input id="f-password" type="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-auth" data-busy-text="Signing in…">Sign In</button>
        </div>
      </form>
    </div>
    <p class="auth-footnote">No account yet? <a href="register.html">Register</a></p>
    <p class="auth-footnote u-mt-0-5rem"><a class="u-text-rgba-255-255-255-0-86 u-fw-500" href="index.html">← Back to Main Page</a></p>
  </div>
<script src="static/js/chrome.js?v=1" defer></script>
<script src="static/js/tooltip.js?v=2" defer></script>
<script src="static/js/loading.js?v=3" defer></script>
<script src="static/demo/demo.js"></script>
</body>
</html>
